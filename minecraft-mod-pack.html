<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Mod Pack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2f855a 0%, #1a202c 100%);
            min-height: 100vh;
            color: #fff;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.65rem 1.2rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: rgba(56, 161, 105, 0.25);
            border: 1px solid rgba(104, 211, 145, 0.55);
        }

        nav a:hover {
            background: rgba(56, 161, 105, 0.45);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2.5rem 1.2rem;
        }

        .hero {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .pack-image {
            width: 100%;
            display: block;
            max-height: 380px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.25);
        }

        .hero-content {
            padding: 1.5rem;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: #9ae6b4;
        }

        .pack-name-link {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 0.2em;
            text-decoration-color: rgba(154, 230, 180, 0.7);
        }

        .pack-name-link:hover {
            color: #c6f6d5;
            text-decoration-color: rgba(198, 246, 213, 0.95);
        }

        .version {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1rem;
        }

        .mods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.4rem;
        }

        .mods-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 1.2rem;
            backdrop-filter: blur(10px);
        }

        .mods-card h2 {
            font-size: 1.2rem;
            margin-bottom: 0.9rem;
        }

        .mods-card.added h2 {
            color: #9ae6b4;
        }

        .mods-card.removed h2 {
            color: #feb2b2;
        }

        .mods-list {
            list-style: none;
        }

        .mods-list li {
            padding: 0.55rem 0.7rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .added .mods-list li {
            background: rgba(72, 187, 120, 0.2);
            border: 1px solid rgba(72, 187, 120, 0.45);
        }

        .removed .mods-list li {
            background: rgba(245, 101, 101, 0.18);
            border: 1px solid rgba(245, 101, 101, 0.42);
        }

        .mod-version {
            margin-left: 0.4rem;
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.9rem;
        }

        .loading,
        .error {
            text-align: center;
            font-size: 1.05rem;
            margin-top: 2.5rem;
        }

        .error {
            color: #feb2b2;
        }

        footer {
            text-align: center;
            padding: 2rem 0 0;
            margin-top: 2rem;
        }

        .shared-footer-frame {
            width: 100%;
            height: 48px;
            border: 0;
            background: transparent;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 1.65rem;
            }

            nav {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">← Back to Home</a>
        <a href="twitch/">Twitch Hub</a>
    </nav>

    <div class="container">
        <div id="content" class="loading">Loading mod pack details...</div>

        <footer>
            <iframe class="shared-footer-frame" src="footer.html" title="Site footer"></iframe>
        </footer>
    </div>

    <script>
        function renderModPack(data) {
            const content = document.getElementById('content');
            const packUrl = typeof data.packUrl === 'string' ? data.packUrl.trim() : '';
            const packName = data.packName || 'Minecraft Mod Pack';
            const addedMods = Array.isArray(data.addedMods) ? data.addedMods : [];
            const removedMods = Array.isArray(data.removedMods) ? data.removedMods : [];

            function renderAddedModItem(mod) {
                if (typeof mod === 'string') {
                    return `<li>${mod}</li>`;
                }

                if (mod && typeof mod === 'object') {
                    const name = typeof mod.name === 'string' ? mod.name : 'Unnamed Mod';
                    const url = typeof mod.url === 'string' ? mod.url.trim() : '';
                    const version = typeof mod.version === 'string' && mod.version.trim()
                        ? `<span class="mod-version">(${mod.version.trim()})</span>`
                        : '';

                    if (url) {
                        return `<li><a class="pack-name-link" href="${url}" target="_blank" rel="noopener noreferrer">${name}</a>${version}</li>`;
                    }

                    return `<li>${name}${version}</li>`;
                }

                return '<li>Unknown Mod</li>';
            }

            const addedList = addedMods.map((mod) => renderAddedModItem(mod)).join('');
            const removedList = removedMods.map((mod) => `<li>${mod}</li>`).join('');
            const packTitleHtml = packUrl
                ? `<h1><a class="pack-name-link" href="${packUrl}" target="_blank" rel="noopener noreferrer">${packName}</a></h1>`
                : `<h1>${packName}</h1>`;

            const minecraftVersion = typeof data.minecraftVersion === 'string' && data.minecraftVersion.trim()
                ? `<p class="version">Minecraft Version: ${data.minecraftVersion.trim()}</p>`
                : '';

            content.className = '';
            content.innerHTML = `
                <section class="hero">
                    <img src="${data.packImage}" alt="${data.packName} pack image" class="pack-image" />
                    <div class="hero-content">
                        ${packTitleHtml}
                        <p class="version">Pack Version: ${data.version}</p>
                        ${minecraftVersion}
                    </div>
                </section>

                <section class="mods-grid">
                    <article class="mods-card added">
                        <h2>Added Mods</h2>
                        <ul class="mods-list">
                            ${addedList}
                        </ul>
                    </article>

                    <article class="mods-card removed">
                        <h2>Removed Mods</h2>
                        <ul class="mods-list">
                            ${removedList}
                        </ul>
                    </article>
                </section>
            `;
        }

        async function loadModPack() {
            try {
                const response = await fetch('minecraft-mod-pack.json', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                renderModPack(data);
            } catch (error) {
                console.error('Error loading mod pack:', error);
                const content = document.getElementById('content');
                content.className = 'error';
                content.textContent = 'Error loading mod pack details. Please try again.';
            }
        }

        document.addEventListener('DOMContentLoaded', loadModPack);
    </script>
</body>
</html>
